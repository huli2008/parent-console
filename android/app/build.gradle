plugins {
    id 'com.android.application'
}

android {
    namespace 'com.parent.console'
    compileSdk 33

    defaultConfig {
        applicationId "com.parent.console"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
